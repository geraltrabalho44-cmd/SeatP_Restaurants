# Deploy to the Vercel project seatplan (team seat-plan) after CI passes on main.
# Uses a Vercel token instead of the Vercel GitHub integration, so the GitHub
# account does not have to be linked to this Vercel account.
# Repository secrets needed: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

name: deploy

# Switched off in this repository until it has its own Vercel project and the three secrets above.
# To switch it on again, put back the workflow_run trigger of the original (see git history).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy to production (Vercel builds remotely with vercel.json)
        run: npx --yes vercel@65.16.0 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
