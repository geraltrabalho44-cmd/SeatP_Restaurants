# Continuous integration: every pull request and every push to main must pass
# lint, tests, build, a dependency audit and a secret scan before it can ship.
# Nothing here deploys. Vercel deploys every push to main on its own, whether CI passed or not,
# so protect main on GitHub (require a pull request and these checks) to make CI a real gate.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read
  pull-requests: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r ../requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff)
        run: ruff format --check .
      - name: Tests (pytest, SQLite per test)
        run: python -m pytest
      - name: Dependency audit (runtime dependencies, fails on any known vulnerability)
        run: pip-audit -r ../requirements.txt

  backend-postgres:
    # The same tests against the database the live site uses (Neon is Postgres). SQLite hides things
    # like a NUL character in a parameter, or how two requests really race. Each test gets its own
    # fresh database on this server (backend/tests/conftest.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEATPLAN_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r ../requirements.txt -r requirements-dev.txt
      - name: Tests (pytest, a fresh Postgres database per test)
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Colour contrast check
        run: npm run contrast
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high

  e2e:
    # Browser tests: the real backend on a fresh temporary SQLite database with
    # the demo data, the freshly built frontend, and headless Chromium
    # (frontend/playwright.config.ts starts and stops both servers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (uvicorn comes from requirements-dev)
        run: pip install -r ../requirements.txt -r ../backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install headless Chromium and its system libraries
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser tests (Playwright)
        env:
          E2E_PYTHON: python
        run: npm run e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret committed and later deleted is still found.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
